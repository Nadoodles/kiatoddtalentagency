name = "kia-todd-talent"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# R2 bucket that submission uploads land in. Create the bucket first
# (`wrangler r2 bucket create kia-todd-submissions`, or via the dashboard),
# then this binding makes it available in functions as env.SUBMISSIONS_BUCKET.
[[r2_buckets]]
binding = "SUBMISSIONS_BUCKET"
bucket_name = "kia-todd-submissions"

# Secrets (RESEND_API_KEY) and plain env vars (NOTIFY_EMAIL, FROM_EMAIL) are NOT set
# here — set them in the Cloudflare Pages dashboard under Settings > Environment
# variables, or locally for `wrangler pages dev` via a .dev.vars file (gitignored):
#
#   RESEND_API_KEY=re_xxxxxxxx
#   NOTIFY_EMAIL=kia@kiatoddtalent.com
#   FROM_EMAIL=submissions@kiatoddtalent.com
