<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kia Todd Talent — Boutique Talent Representation in Los Angeles</title>
  <meta name="description" content="Kia Todd Talent is a SAG-AFTRA franchised, full-service talent agency in Los Angeles representing theatrical, commercial, host, voice over, and youth talent." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-nav" id="siteNav"></header>

  <main class="page">

    <section class="hero">
      <div class="hero-copy reveal">
        <span class="hero-eyebrow">Kia Todd Talent Agency</span>
        <h1>Boutique talent representation in Los Angeles.</h1>
        <p class="hero-sub">Representing emerging and established talent across theatrical, commercial, voice over, hosting, and youth work.</p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="talent.html">View Our Talent</a>
          <a class="btn" href="submissions.html">Submit to the Agency</a>
        </div>
      </div>
      <div class="hero-media reveal" aria-hidden="true">
        <div class="hero-photo hero-photo-a">
          <img src="assets/talentTheatrical/jazsminLewis.avif" alt="" loading="eager" />
        </div>
        <div class="hero-photo hero-photo-b">
          <img src="assets/commercial/coreyMekell.avif" alt="" loading="eager" />
        </div>
      </div>
    </section>


  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="js/data.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/home.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var grid = document.getElementById("divisionsGrid");
      grid.innerHTML = DIVISIONS.map(function (d) {
        return (
          '<a class="division-card" href="talent.html?division=' + d.id + '">' +
            '<span class="name">' + d.label + "</span>" +
            '<span class="tagline">' + d.tagline + "</span>" +
          "</a>"
        );
      }).join("");
    });
  </script>
</body>
</html>
